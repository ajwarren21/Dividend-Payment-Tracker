spring:
    config:
        import: "optional:file:.env[.properties]"
    application:
        name: dividend-tracker
        version: 1.0.0
    output:
        ansi:
            enabled: always

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

server:
    port: 8080

